name: Check and Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    env:
      # Keep CI aligned with the contest acceptance toolchain and local verification.
      MOONBIT_INSTALL_VERSION: 0.10.3
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install MoonBit (Unix)
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$MOONBIT_INSTALL_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          $env:MOONBIT_INSTALL_VERSION = "0.10.3"
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Moon version
        run: moon version --all

      - name: Moon update
        run: moon update

      - name: moon fmt --check
        run: moon fmt --check

      - name: moon info
        run: moon info

      - name: moon check --deny-warn --target all
        run: moon check --deny-warn --target all

      - name: moon test --deny-warn --target all
        run: moon test --deny-warn --target all

      - name: workflow benchmark corpus
        run: moon run benchmarks

      - name: order workflow example
        run: moon run examples/order_workflow

      - name: Acceptance gate
        shell: pwsh
        run: ./scripts/verify_acceptance.ps1 -SkipMooncakes
