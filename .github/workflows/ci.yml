name: Check and Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install MoonBit (Unix)
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Moon version
        run: moon version --all

      - name: Moon update
        run: moon update

      - name: moon fmt --check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          moon fmt --check
          $formatExit = $LASTEXITCODE
          if ($formatExit -ne 0) {
            # MoonBit 0.10.4 may normalize legacy 0.10.3 package metadata.
            # Accept only that metadata-only change; all source changes remain errors.
            moon fmt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $unexpected = @(git diff --name-only | Where-Object { $_ -notmatch '(^|/)moon\.pkg$' })
            if ($unexpected.Count -gt 0) {
              Write-Error ('Unexpected formatting changes: ' + ($unexpected -join ', '))
              exit 1
            }
            git diff --name-only | ForEach-Object { git checkout -- $_ }
          }
          exit 0

      - name: moon info
        run: moon info

      - name: moon check --deny-warn --target all
        run: moon check --deny-warn --target all

      - name: moon test --deny-warn --target all
        run: moon test --deny-warn --target all

      - name: workflow benchmark corpus
        run: moon run benchmarks

      - name: order workflow example
        run: moon run examples/order_workflow

      - name: support workflow example
        run: moon run examples/support_workflow

      - name: incident workflow example
        run: moon run examples/incident_workflow

      - name: Acceptance gate
        shell: pwsh
        run: ./scripts/verify_acceptance.ps1 -SkipMooncakes
